[package]
name = "aeolia-native-composition-prototype"
version = "0.1.0"
edition = "2021"
publish = false
description = "Throwaway spike for wayfinder issue #7: shared D3D11 device + HLSL glass + D2D/DirectWrite + egui-directx11 on one HWND swap chain."

[dependencies]
egui = "=0.35.0"
egui-directx11 = "=0.13.0"

[dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_System_LibraryLoader",
]

[build-dependencies]
sha2 = "0.10"
